[versions]
cloudnet = "4.0.0-RC10"
retrofit = "3.0.0"
junit = "6.1.3"

[libraries]
lombok = { module = "org.projectlombok:lombok", version = "1.18.48" }
cloudnet-driver = { module = "eu.cloudnetservice.cloudnet:driver", version.ref = "cloudnet" }
cloudnet-wrapper = { module = "eu.cloudnetservice.cloudnet:wrapper-jvm", version.ref = "cloudnet" }
cloudnet-platform-inject-api = { module = "eu.cloudnetservice.cloudnet:platform-inject-api", version.ref = "cloudnet" }
cloudnet-platform-inject-processor = { module = "eu.cloudnetservice.cloudnet:platform-inject-processor", version.ref = "cloudnet" }
cloudnet-bridge = { module = "eu.cloudnetservice.cloudnet:bridge", version.ref = "cloudnet" }
gson = { module = "com.google.code.gson:gson", version = "2.14.0" }
guava = { module = "com.google.guava:guava", version = "33.7.2-jre" }
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-converter-gson = { module = "com.squareup.retrofit2:converter-gson", version.ref = "retrofit" }
paper-api = { module = "io.papermc.paper:paper-api", version = "26.3.build.197-stable" }
paperspigot-api = { module = "org.github.paperspigot:paperspigot-api", version = "1.8.8-R0.1-SNAPSHOT" }
jetbrains-annotations = { module = "org.jetbrains:annotations", version = "26.1.0" }
packetevents-spigot = { module = "com.github.retrooper:packetevents-spigot", version = "2.14.0" }
bungeecord-api = { module = "net.md-5:bungeecord-api", version = "1.21-R0.4" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
shadow = { id = "com.gradleup.shadow", version = "9.6.1" }
